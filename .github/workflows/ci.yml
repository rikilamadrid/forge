name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The Wonder Wagon foundations are `file:` devDependencies on a sibling checkout until
      # the packages publish, so CI recreates that sibling at a pinned commit and builds the
      # two packages Forge consumes. Bump the ref together with `npm run wonder-wagon:sync`.
      - name: Check out the Wonder Wagon foundations beside this repository
        env:
          WONDER_WAGON_UI_REF: 139de1bb6ffd19c4efc003bb0fe0a2e5197817ba
        run: |
          git clone --quiet --no-checkout https://github.com/rikilamadrid/wonder-wagon-ui.git ../wonder-wagon-ui
          git -C ../wonder-wagon-ui checkout --quiet "$WONDER_WAGON_UI_REF"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ../wonder-wagon-ui/package.json
      - name: Build @wonder-wagon/tokens and @wonder-wagon/themes
        working-directory: ../wonder-wagon-ui
        run: |
          bun install --frozen-lockfile
          bun run --filter '@wonder-wagon/tokens' build
          bun run --filter '@wonder-wagon/themes' build
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Pack the artifact
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          filename="$(npm pack --json --pack-destination "$RUNNER_TEMP/pack" \
            | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8"))[0].filename')"
          echo "tarball=$RUNNER_TEMP/pack/$filename" >> "$GITHUB_OUTPUT"
      - name: Verify the artifact
        run: node scripts/verify-package.mjs "${{ steps.pack.outputs.tarball }}"

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Require static output
        run: test -s site/dist/index.html

  # The one status check branch protection requires. It stays named "CI" however
  # the matrix above changes.
  CI:
    name: CI
    needs: [test, site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix cell and the site build to succeed
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          echo "site result: ${{ needs.site.result }}"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.site.result }}" = "success"
